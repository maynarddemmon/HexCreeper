<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HexCreeper</title>
<link rel="preload" href="./fonts/SpaceMono-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
	@font-face {
		font-family:'SpaceMono';
		src:url('./fonts/SpaceMono-Regular.ttf') format('truetype');
	}

	:root {
		--bg:#444;
		--grid:#555;
		--grid-major:#666;
		
		--ink:#eee;
		--muted:#aaa;
		
		--core:#fa0;
		--core-dark:#c70;
		
		--visited:#6303; /* Visited quad color */
		--fog:#0009; /* Fog-of-war fill color */
		
		--enemy:#89d;
		--enemy-dark:#cdf;
		--enemy-link:#ccf8;
		
		--move:      #e754;
		--move-hover:#e757;
		
		--attack:      #89c4;
		--attack-hover:#89c7;
		
		--place:      #fb44;
		--place-hover:#fb47;
		--place-ink:  #fb4;
		
		--path:       #fb48; /* Golden Path */
		
		--link:       #fa86; /* Link between unselected player pieces */
		--range:      #fa86; /* Dashed Line around a piece's parent that shows allowed link distances */
		
		--sel-bg:     #fb45; /* Hex Tint around a selected player piece */
		--sel-fill:   #fb4;  /* Fill within a selected player piece */
		--sel-stroke: #fe3;  /* Stroke around a selected player piece */
		--sel-link:   #fb46; /* Link between selected player pieces */
		--sel-tint:   #fb42; /* Tint of the hex around descendants of a selected player piece */
		
		--dmg:#f65;
		--gain:#6d8;
		
		--hp-bar:#e33; /* A piece's HP bar */
		--ap-bar:#fff; /* and its action points bar, under it */
		--ap-bar-partial:#999; /* (the part of a point past its whole ones) */
		--thirst-bar: #39f; /* The info panel's bars for the selected piece's needs (see Needs.js) */
		--hunger-bar: #a0662d;
		--fatigue-bar:#f80;
		--xp-bar:     #4c4; /* and its XP */
		--effect-icon:#fff; /* A piece's status effect icons, above it */
		--level-up:#fd4;    /* A piece's level up rings, its stat points marker, and the Character button while it has points */
		--level-up-bg:#fd44;
		--enemy-arrow:#f33; /* Arrows at the edge pointing to enemy squads you can see but that are off the board */
		
		--heal:      #6d8;
		--heal-bg:   #6d82;
		--heal-hover:#6d84;
		
		--harm:      #f65;
		--harm-bg:   #f652;
		--harm-hover:#f654;
		
		--loot:      #eb4;
		--loot-bg:   #eb42;
		--loot-hover:#eb44;
		--loot-ink:  #862;
		
		--item:    #ca7; /* The marker on a cell with things on the ground */
		--item-ink:#542;
		
		--solid:#888;
		--solid-edge:#999;
		
		--hole:#111;
		--hole-line:#666;
		
		--header-bg:#0006;
		--header-text:#eee;
		
		--dlg-bg:#333;
		--dlg-header:#444;
		--dlg-footer:#444;
		
		--menu-bg:#0004;
		
		--btn-bg:#000c;
		--btn-bg-hover:#333c;
	}

	html,body {height:100%;margin:0px;padding:0px;border:0px none;overflow:hidden;}
	input,textarea,select {box-sizing:border-box;}
	input.mytNativeInput:not([type=button]), textarea.mytNativeInput {margin:0px;padding:1px;border:0px none;}
	.mytButtonText {font-size:12px;font-weight:bold;}
	.mytUnselectable {user-select:none;}
	::placeholder {user-select:none;}

	body {
		background:var(--bg);
		color:var(--ink);
		font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
		font-size:13px;
	}

	#appDiv {
		position:absolute;
		width:100%;
		height:100%;
	}

	/* The game board (see view/View.js and view/GameView.js) */
	canvas.hc-canvas {display:block; width:100%; height:100%; touch-action:none; cursor:grab;}
	canvas.hc-canvas.dragging {cursor:grabbing;}

	/* Buttons */
	.hc-Btn {
		font-family:inherit;
		font-size:13px;
		font-weight:600;
		color:var(--core-dark);
		background-color:var(--btn-bg);
		border:1px solid var(--core-dark);
		border-radius:6px;
		cursor:pointer;
	}
	.hc-Btn:hover {background-color:var(--btn-bg-hover);}
	.hc-Btn.disabled {opacity:0.45; cursor:default;}
	.hc-Btn.disabled:hover {background-color:var(--btn-bg);}

	/* A mode that's on, e.g. Place or Heal while choosing, or the chosen grid. */
	.hc-Btn.on {background-color:var(--sel-bg); border-color:var(--sel-stroke); color:var(--ink);}

	.hc-Btn.plain {background-color:transparent; border:1px solid transparent; color:var(--ink);}
	.hc-Btn.plain:hover {background-color:var(--btn-bg-hover);}

	.hc-Btn.solid {background-color:var(--core); border-color:var(--core); color:#fff;}
	.hc-Btn.solid:hover {background-color:var(--core-dark); border-color:var(--core-dark);}
	.hc-Btn.solid.disabled:hover {background-color:var(--core); border-color:var(--core);}

	/* Something waiting for you, e.g. stat points to spend: the button pulses. */
	.hc-Btn.attention {animation:hc-attention 1.2s ease-in-out infinite; border-color:var(--level-up); color:var(--ink);}
	@keyframes hc-attention {
		0%, 100% {background-color:var(--btn-bg); box-shadow:0 0 0 0 transparent;}
		50% {background-color:var(--level-up-bg); box-shadow:0 0 6px 1px var(--level-up);}
	}

	.hc-Btn.underline {
		background-color:transparent;
		border-radius:0px;
		border:none;
	}
	.hc-Btn.underline::after {
		pointer-events:none;
		content:"";
		position:absolute;
		background-color:var(--core-dark);
		left:0;
		bottom:1px;
		width:0;
		height:1px;
		transition:width .3s ease;
	}
	.hc-Btn.underline:hover::after {width:100%;}
	.hc-Btn.underline.disabled:hover::after {width:0%;}
</style>
<script>
const writeScript = src => document.write('<script src="./'+src+'.js">\x3C/script>');
writeScript('lib/myt.min');
let LOCALE_KEY;
(() => {
	const SUPPORTED_LOCALES = {
		en:{US:{default:true}, default:true}
	};
	let [lang, country] = navigator.language.split('-'),
		supportedEntry = SUPPORTED_LOCALES[lang];
	if (!supportedEntry) {
		for (lang in SUPPORTED_LOCALES) {
			supportedEntry = SUPPORTED_LOCALES[lang];
			if (supportedEntry.default === true) break;
		}
	}
	if (!supportedEntry[country]) {
		for (country in supportedEntry) {
			if (supportedEntry[country].default === true) break;
		}
	}
	document.getElementsByTagName('html')[0].lang = LOCALE_KEY = lang + '-' + country;
	writeScript('i18n/' + LOCALE_KEY);
	writeScript('i18n/rsrc-' + LOCALE_KEY);
})();
globalThis.HC_ROOT = './js/hc/';
writeScript('lib/loader-browser.min');
writeScript('js/hc/manifest');
</script>
</head><body><div id="appDiv"></div>
<script>
JS.require('hc.App', () => {new hc.App(document.getElementById('appDiv'));});
// Development tools (the combat simulator, hc.simulate), with ?dev in the URL
if (/[?&]dev\b/.test(location.search)) JS.require('hc.simulate');
</script>
</body></html>
